故选 B。`,words:["络绎不绝","纷至沓来","门庭冷落","无人问津","门可罗雀","川流不息","泥沙俱下","良莠不齐","参差不齐","大相径庭","比肩接踵"]},{id:"ex78",source:"2018 年黑龙江省考",material:'当下，"网红食品"让一些美食爱好者＿＿＿＿。然而，朋友圈里的美食宣传往往真假莫辨，"网红食品"利用朋友圈熟人关系、口碑传播的社交特性推销产品，甚至＿＿＿＿营销公众号为其背书。',options:["接踵而至　鼓动","蜂拥而至　发起","亦步亦趋　策动","趋之若鹜　发动"],answerIndex:3,analysis:`第一空：「接踵而至」「蜂拥而至」都表示"到某处来"，但文段只说美食爱好者追捧网红食品，并没有体现他们去某个地方，A、B 均不合语境；「亦步亦趋」指没有主见、事事模仿别人，美食爱好者追捧食品不是"模仿"，C 不符。「趋之若鹜」指像鸭子一样成群跑过去，比喻争相追逐（含贬义），与作者对"网红食品"的否定态度一致。
第二空：「发动」营销公众号（使其为己所用）搭配成立；「策动」多含阴谋意味，过重。
故选 D。`,words:["接踵而至","蜂拥而至","趋之若鹜","亦步亦趋"]},{id:"ex79",source:"2023 年上海市考",material:'京剧与中医、武术、国画并称中国的"四大国粹"，半个世纪前，那些名角、"头牌"演出时，往往＿＿＿＿，一票难求。而在当今，年轻一代往往对本土传统文化弃之如敝履，对带洋字的文化则＿＿＿＿。',options:["万人空巷　趋之若鹜","洛阳纸贵　炙手可热","门庭若市　众星拱月","万头攒动　敬而远之"],answerIndex:0,analysis:`第一空：「洛阳纸贵」专指著作风行、著作受欢迎，不能形容演出，排除 B；「门庭若市」形容来的人多，主语应是场所而非"演出"这件事，且与"一票难求"搭配不如"万人空巷"，排除 C；「万头攒动」形容许多人乱哄哄地聚集，含杂乱意味，与名角演出的盛况不符，排除 D。「万人空巷」指家家户户的人都出来了，多形容庆祝、欢迎的盛况，正合"一票难求"。
第二空：年轻一代对洋文化"争相追捧"，「趋之若鹜」贬义正合「弃之如敝履」的对照；「敬而远之」是尊敬但远离，与"追捧"相反，恰是对传统文化的态度，不能填第二空。
故选 A。`,words:["万人空巷","趋之若鹜","门庭若市","敬而远之","炙手可热","洛阳纸贵"]},{id:"ex80",source:"2016 年四川省考",material:'经历了数代学院派导演在艺术上的探索和产业化白手起家的拓荒，电影不再只是"声光电"的艺术形式，更开启了一个＿＿＿＿的市场化运作的时代。众多资本的涌入，一方面创造出巨大的利益空间，另一方面也暴露出行业内部的"＿＿＿＿"——创作者的良莠不齐，伴之以评论界的莫衷一是，网络世界的众说纷纭，可谓"乱哄哄你方唱罢我登场"，乱象频生。',options:["波澜壮阔　鱼目混珠","雄心勃勃　鱼龙混杂","焕然一新　尔虞我诈","意气风发　良莠不齐"],answerIndex:1,analysis:`第二空（突破口）：后文已有「良莠不齐」，D 项第二空与之字面重复，排除 D；「尔虞我诈」指互相欺骗，而文段说的是行业内部"好人坏人都有"，C 不符；「鱼目混珠」指以假充真、以次充好，侧重"假"，而文段强调"好坏掺杂"而非造假，A 不符。「鱼龙混杂」指好人和坏人混在一起，正合文意。
第一空：「雄心勃勃」形容资本的跃跃欲试，符合"众多资本涌入想分一杯羹"的语境；「波澜壮阔」形容声势浩大，多形容运动、历程，与"市场化运作的时代"不搭。
故选 B。`,words:["鱼龙混杂","鱼目混珠","良莠不齐","尔虞我诈"]},{id:"ex81",source:"2018 年辽宁省考",material:'近年来每逢传统节日、西方节日，抑或是"双 11、双 12"等人造节日，都成为互联网商家炒作的卖点，成为那些足不出户的年轻网民"买买买"的"狂欢盛宴"。交易额的放量增长带来了快递业的繁荣发展。然而快递数激增、过度包装、违规包装造成的污染及危害愈发＿＿＿＿；假货、仿冒品、残次品＿＿＿＿，随之而来是一些消费者维权困难，因此加强网购平台监管责任迫在眉睫。',options:["有目共睹　层出不穷","引人关注　鱼目混珠","引人注目　鱼龙混杂","备受瞩目　以假乱真"],answerIndex:1,analysis:`第二空（突破口）：文意是"用假货、仿冒品、残次品冒充正品"。「鱼龙混杂」指好人坏人混在一起，不能形容货，排除 C；「以假乱真」只有"以假充真"，少了"残次品以次充好"这层意思，不如「鱼目混珠」，排除 D；「层出不穷」指接连不断地出现，只强调"多"，体现不出"以假充真"，排除 A。「鱼目混珠」比喻以假乱真、以次充好，最全面。
第一空：「有目共睹」多搭配成绩、成效等褒义对象；「备受瞩目」一般用于褒义语境——而"污染及危害"是贬义对象，排除 A、D；「引人注目」侧重"吸引眼球"（中性），「引人关注」指值得人们关心忧虑，与"危害愈发"搭配更贴切。
故选 B。`,words:["鱼目混珠","鱼龙混杂","以假乱真","层出不穷","有目共睹","引人注目"]},{id:"ex82",source:"2021 年新疆区考",material:'一直以来，为偶像打榜、刷数据＿＿＿＿，其背后除了粉丝的狂热之外，更有"大粉"们的引导和灰色产业链的助推。此前，"星缘"APP 利用粉丝给"爱豆"刷流量的需求，疯狂牟利，不到一年吸金 800 余万元。',options:["大张旗鼓","大行其道","风靡一时","蔚然成风"],answerIndex:1,analysis:`「风靡一时」指流行了**一段时间**，与题干"一直以来"（持续很久）语义冲突，排除 C；「大张旗鼓」侧重做事公开、不隐瞒，文段说的是"刷数据"这件事盛行而非"公开进行"，排除 A；「蔚然成风」指形成良好的风气，褒义，"刷数据"是负面现象不能用，排除 D。「大行其道」指新潮事物流行成一种风尚（中性偏贬），正合"灰色产业链助推"的贬义语境。
故选 B。`,words:["大行其道","风靡一时","大张旗鼓","蔚然成风"]},{id:"ex83",source:"2017 年联考",material:"晚明江南的富裕，提供了附庸风雅的环境与条件，使得饮茶风尚引发了名牌效应。先是苏州虎丘茶风行，然后有大方和尚以虎丘制茶法在徽州松萝山制茶，造就了明末＿＿＿＿的松萝茶。一旦成了名牌，人们追求时尚，＿＿＿＿，商家就有了商机，争相仿制，价格也直线上升。",options:["如雷贯耳　一掷千金","闻名遐迩　如影随形","声名鹊起　趋之若鹜","风靡一时　蜂拥而至"],answerIndex:2,analysis:`首句"附庸风雅"已定下作者不认可的态度，选项需带贬义色彩。
第一空：「如雷贯耳」一般形容人的名声，中性偏褒，且不能直接修饰"松萝茶"的兴起，排除 A；「闻名遐迩」是褒义词，体现不出贬义，排除 B。
第二空：「如影随形」指关系亲密、常在一起，人们与追求时尚并非"相伴"关系，排除 B；「蜂拥而至」必须体现"人们朝某个地方去"，后文只说商家仿制、价格上升，没有人们涌向某地，排除 D。「趋之若鹜」指争相追逐，贬义，正合"附庸风雅"的讽刺。
故选 C。`,words:["声名鹊起","趋之若鹜","如雷贯耳","闻名遐迩","如影随形","蜂拥而至","风靡一时","一掷千金"]},{id:"ex84",source:"2023 年国考",material:"我们确立和坚持马克思主义在意识形态领域指导地位的根本制度，新时代党的创新理论＿＿＿＿，社会主义核心价值观广泛传播，中华优秀传统文化得到创造性转化、创新性发展，文化事业日益繁荣，网络生态持续向好，意识形态领域形势发生＿＿＿＿、根本性转变。",options:["振聋发聩　历史性","深入人心　全局性","高屋建瓴　实质性","硕果累累　显著性"],answerIndex:1,analysis:`第一空：应与后文「广泛传播」对应——「广泛」说传播的范围广，空缺处应说传播的**程度深**。「振聋发聩」指唤醒麻木的人，强调作用而非传播程度，排除 A；「高屋建瓴」形容居高临下的气势，多形容站位、见解，排除 C；「硕果累累」指成果多，与"传播"无关，排除 D。「深入人心」指理论被深刻理解、信奉，正与"广泛传播"形成"深 vs 广"的对应。
第二空：应与「根本性」对应——根本性指程度深、彻底，空缺处应指范围广、全面，「全局性」正合此意。
故选 B。`,words:["深入人心","振聋发聩","高屋建瓴","硕果累累"]},{id:"ex85",source:"2021 年广东选调",material:"一些戏曲剧目是＿＿＿＿的经典之作，深受群众喜爱。这既是因为其艺术价值高，更是因为其中蕴含着深沉的家国情怀，＿＿＿＿着追求正义与美好的理想。",options:["风靡一时　肩负","交口称赞　怀揣","喜闻乐见　秉持","脍炙人口　承载"],answerIndex:3,analysis:`第一空：「风靡一时」指只流行了一段时间，与"经典之作"（经得起时间考验）矛盾，排除 A；「交口称赞」是动词性短语，语法上不能直接作定语修饰"经典之作"，排除 B；「喜闻乐见」主语应是人（"群众喜闻乐见"），剧目自己不能"喜闻乐见"，排除 C。「脍炙人口」比喻好的作品人人赞美传诵，可修饰经典之作。
第二空：主语是"戏曲剧目"。「怀揣」的主体必须是人，搭配不当，排除 B；「秉持」后常接原则、观点、态度，不接"理想"，排除 C；「承载」指剧目作为载体寄托着理想，搭配恰当。
故选 D。`,words:["脍炙人口","风靡一时","喜闻乐见"]},{id:"ex86",source:"2019 年国考",material:'中国的传统文化中，"老"是一个褒义的字眼。一个年轻人处事得当，会被说老练、老成。但是进入互联网特别是移动互联网时代，这沿袭了数千年的观念，短短数十年＿＿＿＿。年龄大、资历老逐渐不再是一种优势，有时反而成了学习新事物的一种＿＿＿＿。',options:["土崩瓦解　羁绊","灰飞烟灭　累赘","化为乌有　阻力","分崩离析　弊端"],answerIndex:0,analysis:`第一空：搭配对象是「观念」。「灰飞烟灭」指像灰、烟一样消失，多形容具体事物或势头消亡，与抽象"观念"搭配不当，排除 B；「化为乌有」常搭配努力、积蓄、成果等，不说观念化为乌有，排除 C；「分崩离析」形容国家、集团、组织分裂瓦解，不能形容观念，排除 D。「土崩瓦解」可形容思想观念彻底崩塌，搭配得当。
第二空：「羁绊」指束缚、牵制，"成了学习新事物的羁绊"符合文意。
故选 A。`,words:["土崩瓦解","分崩离析","化为乌有"]},{id:"ex87",source:"2022 年事业单位联考",material:'儿童文学不仅给孩子带来快乐，满足孩子的情感需求，还关乎心灵的＿＿＿＿和人格的完善。"趣"是很高的美学范畴，不是说哈哈一笑之后，＿＿＿＿。让孩子笑并不难，难的是传达一种理想的、有境界的"趣"。',options:["纯净　云淡风轻","净化　空无一物","美化　烟消云散","洗涤　别无长物"],answerIndex:1,analysis:`第二空（突破口）：文意是"笑过之后什么都没留下"。「烟消云散」指像烟云一样消散干净，但前面须有"笼罩着的不良事物"（烦恼、疑虑等）作铺垫，单纯说"笑过之后烟消云散"不搭，排除 C；「别无长物」指没有值钱的东西，形容清贫，与文意无关，排除 D；「云淡风轻」形容天气晴好或人态度豁达，排除 A。「空无一物」指什么都没有，正合"哈哈一笑之后什么也没剩下"。
第一空验证：心灵的「净化」搭配合理。
故选 B。`,words:["烟消云散","云淡风轻","别无长物"]},{id:"ex89",source:"2021 年江苏省考",material:'科学和艺术都追求普遍性和永恒性，追求"真"和"美"。关于普遍性和永恒性是＿＿＿＿的，科学求"真"和艺术求"美"也无需赘言。科学追求的美主要是和谐之美和简洁之美。至于"艺术求真"，是艺术家通过自己的＿＿＿＿把事物的本质揭示出来，这是"源于生活，高于生活"的艺术创作原则。',options:["显而易见　体验","不言自明　把握","有目共睹　认知","不言而喻　感悟"],answerIndex:3,analysis:`第一空：「有目共睹」指人人都能看到，极其明显，多搭配成绩、事实，与"普遍性和永恒性"这种抽象道理不搭，排除 C；「显而易见」侧重"容易看清"，「不言自明」「不言而喻」侧重"不用说就明白"——后文"无需赘言"提示此处应选"不用说就明白"的意思，A 不如 D 贴切。
第二空：艺术家通过「感悟」揭示事物本质，比"体验/把握/认知"更符合艺术创作"源于生活、高于生活"的语境。
故选 D。`,words:["不言而喻","不言自明","显而易见","有目共睹"]},{id:"ex90",source:"2012 年山东省考",material:"吴越历史舞台的中心在哪里，多年来一直是学者与公众共同关注的焦点。尽管古籍文献对此有所＿＿＿＿，但是多＿＿＿＿，有的虽言之凿凿却只是演义。",options:["论证　浮光掠影","涉及　穿凿附会","记载　语焉不详","描述　轻描淡写"],answerIndex:2,analysis:`第一空：文意是古籍文献"写过、记录过"这件事。「论证」指用论据证明观点，古籍文献并非在"论证"，后文也没提观点，排除 A。
第二空：后文"但"转折，且说"有的虽言之凿凿却只是演义"，说明空缺处应体现"记录不详细、不清楚"。「穿凿附会」指把不相干的事情硬扯在一起，与"不详尽"无关，排除 B；「轻描淡写」指说话写文章把重要问题轻轻带过，侧重"有意淡化主要问题"，而非"记载不全"，排除 D。「语焉不详」指虽然提到了但说得不详细，正合文意。
故选 C。`,words:["语焉不详","穿凿附会","轻描淡写","浮光掠影"]},{id:"ex91",source:"2018 年广西选调",material:'我们常说"科学是开放的"，不是"封闭的"，科学的开放性意味着它不是永恒真理，可能出错。可是现实生活中，有些人在科学研究中对科学错误＿＿＿＿，一旦自己的科研成果遇到质疑就立刻将其＿＿＿＿。这看似暂时化解了危机，其实禁锢了自身的发展。',options:["讳莫如深　束之高阁","噤若寒蝉　置之脑后","避而不谈　改头换面","谈虎色变　弃如敝屣"],answerIndex:0,analysis:`第一空：文意是"对科学错误极力隐瞒、避而不谈"。「噤若寒蝉」指因害怕而不敢说话，「谈虎色变」指一提到就害怕，两句都侧重"害怕"而非"隐瞒"，排除 B、D；「避而不谈」只回避不谈论，程度不如「讳莫如深」（隐藏得极深）。
第二空：「改头换面」指只换形式不换内容，与"科研成果遇到质疑"的语境无关，排除 C；「弃如敝屣」像破鞋一样扔掉，用于"成果"过重且与"暂时化解危机"矛盾。「束之高阁」指高高放起、置之不理，正合"先把问题搁置"的意思。
故选 A。`,words:["讳莫如深","束之高阁","噤若寒蝉","改头换面","谈虎色变"]},{id:"ex92",source:"2019 年山东选调",material:"我们党领导人民干革命、搞建设、抓改革，从来都是为了解决中国的现实问题。如果对矛盾＿＿＿＿，甚至回避、掩饰矛盾，在矛盾面前畏缩不前，坐看矛盾恶性转化，那就会＿＿＿＿，最后势必造成无法弥补的损失。",options:["置若罔闻　亡羊补牢","视而不见　尾大不掉","闭目塞听　覆水难收","熟视无睹　积重难返"],answerIndex:3,analysis:`第二空（突破口）：后文"最后势必造成无法弥补的损失"提示空缺处应是"问题严重到无法挽回"之意。「亡羊补牢」指出了问题后补救，与"无法弥补"相反，排除 A；「尾大不掉」指机构庞大指挥不灵，与文意无关，排除 B；「覆水难收」比喻事成定局无法挽回，但多指话已说出、婚已离成等既成事实，与"矛盾恶性转化"的渐进过程不搭，排除 C。「积重难返」指问题长期积累到了严重程度，难以改变，正合"坐看矛盾恶性转化"的语境。
第一空验证：对矛盾「熟视无睹」（看惯了就像没看见一样）与"回避、掩饰"递进恰当。
故选 D。`,words:["熟视无睹","积重难返","置若罔闻","视而不见","闭目塞听","亡羊补牢"]},{id:"ex93",source:"2023 年浙江省考",material:"中华文化是一座浩瀚的思想库，里面有很多珍宝，但也不乏糟粕，不是所有的内容都可以复活于当代、贡献于世界。时代的变迁决定了我们不可能＿＿＿＿保留传统文化的一切方面。中华文明有的内容可以超越时空，有的内容则已尘封；有的可以古为今用，有的则应＿＿＿＿。",options:["循规蹈矩　去粗取精","如法炮制　弃如敝履","固步自封　漠然置之","原封不动　束之高阁"],answerIndex:3,analysis:`第一空：文意是"原样全部保留"。「循规蹈矩」指拘泥旧准则不敢变通，主语应是人，排除 A；「如法炮制」指照现成样子办事，多含贬义且侧重"模仿"，排除 B；「固步自封」指守旧不创新，与"保留一切方面"无关，排除 C。「原封不动」指完全保持原样，正合文意。
第二空：应与「古为今用」语义相反——不用就搁置起来。「去粗取精」与文意相反（且"去粗取精"是好的做法），排除 A；「弃如敝履」像破鞋一样扔掉，程度过重，传统文化的糟粕也不应简单丢弃，排除 B；「漠然置之」指冷淡地对待，侧重态度冷淡，排除 C。「束之高阁」指弃置不用，与"有的内容已尘封"呼应，恰当。
故选 D。`,words:["束之高阁","原封不动","循规蹈矩","固步自封","弃如敝屣"]},{id:"ex94",source:"2021 年江苏省考",material:"仔细观察自然是发现的开端，是认识事物奥秘的向导，我们要注意观察自然界的各种事物、各种现象，注意大自然偶然疏忽留下的破绽，通过对这些＿＿＿＿的观察，追根寻源，让大自然＿＿＿＿出各种深藏的秘密。我们要以大自然为师，以自然之道来认识自然、适应自然、调节自然、改造和利用自然，使得人类社会＿＿＿＿，不断向前发展。",options:["蛛丝马迹　袒露　日新月异","细枝末节　显现　顺势而行","精益求精　裸露　改天换地","细致入微　尽显　弃旧图新"],answerIndex:0,analysis:`第一空（突破口）：前文"大自然偶然疏忽留下的破绽"指**不明显的线索**。「细枝末节」指细小而不重要的地方，"破绽"不一定不重要，排除 B；「精益求精」指好了还求更好，不能与"观察"搭配，排除 C；「细致入微」多形容做事、描写细致，不能直接修饰"破绽"，排除 D。「蛛丝马迹」比喻隐约可寻的线索，正合"偶然疏忽留下的破绽"。
第二空：「深藏不露的秘密」把大自然拟人化，「袒露」（坦率地显露）正合拟人语境；「裸露」多指身体暴露，不搭。
第三空：与"不断向前发展"对应，「日新月异」指发展变化快。
故选 A。`,words:["蛛丝马迹","日新月异","细枝末节","改天换地"]},{id:"ex95",source:"2015 年广东省考",material:'如今社会上"厌读"的情绪严重。由于不读书，导致一些人走上邪路。读者厌读固然有读者自身的问题。我们作者是不是也该＿＿＿＿：为什么读者不爱书？是读者不赞成作者的观点吗？未必！既然赞成作者的观点就该同声相应，可读者为什么不来"应"呢？这就告诉我们：作者有个文风问题。再想一想：为什么别人的文章读者＿＿＿＿，奔走相告。而我们的文章读者却＿＿＿＿呢？这只能说明我们的文风确有问题。',options:["扪心自问　爱不释手　不足挂齿","自我反省　奉为至宝　嗤之以鼻","反躬自问　手不释卷　不屑一顾","不耻下问　爱不释手　鄙夷不屑"],answerIndex:2,analysis:`第一空：「不耻下问」指不以向地位学问比自己低的人请教为耻，文段是作者自我反思，没有"向下请教"之意，排除 D。
第二空：「奉为至宝」指把别人的文章当成最珍贵的宝物，程度过重（"奔走相告"只是喜欢传阅），排除 B；「爱不释手」与「手不释卷」都表示喜爱不愿放下，A、C、D 均可，靠后两空排除。
第三空：须搭配"读者"的态度。「不足挂齿」指事情微小不值一提，不能搭配人对文章的态度，排除 A。「不屑一顾」指认为不值得一看，正合"厌读"语境。
故选 C。`,words:["反躬自问","手不释卷","爱不释手","不屑一顾","嗤之以鼻","不耻下问"]}],iv=[{id:"l1-1",source:"第一讲 · 2019 年浙江省考",material:"中国文化的博大精深，来源于其内部生成的________；中国文化的________，取决于其变迁过程中各 种元素、层次、类型在内容和结构上通过碰撞、________、融合而产生的革故鼎新的强大动力。 依次填入画横线部分最恰当的一项是：",options:["绵延不绝 长盛不衰 交流","源远流长 与时俱进 对话","多姿多彩 历久弥新 解构","千姿百态 推陈出新 重构"],answerIndex:2,analysis:"第一个空侧重说的是中国文化的丰富，A 连绵不绝侧重连续性，B 源远流长侧重历史久，AB 排除。 第二个空，最后一句革故鼎新想说明的是中国文化的新、创新，D 的推陈出新是一个动作动词， 可以说是要推陈出新，一般不形容文化的特点 第三个空，应该体现出这种过程，先碰撞，再裂开解构，最后融合",words:["与时俱进","历久弥新","推陈出新","源远流长","重构","长盛不衰"]},{id:"l1-2",source:"第一讲 · 2018 年联考",material:"________的中华民族发展史是中国人民书写的，________的中华文明是中国人民创造的，________的 中华民族精神是中国人民培育的，中华民族迎来了从站起来、富起来到强起来的伟大飞跃是中国人民奋斗 出来的。 依次填入画横线部分最恰当的一项是：",options:["波澜壮阔 博大精深 历久弥新","恢弘壮丽 源远流长 同舟共济","气势磅礴 奔流不息 与时俱进","延绵不断 厚积薄发 奋发有为"],answerIndex:0,analysis:"第一个空固定搭配，波澜壮阔的发展史，浩浩荡荡，百年征程波澜壮阔，恢弘壮丽一般形容自然风光， 气势磅礴体现的是气势，用于一些文章，书法等，延绵不绝体现连续不间断 第二个空形容中华文明，博大精深和源远流长都可以，但是奔流不息侧重的是动态，一种前进性，不停 歇，这个空说的是人民创造的，没有这种变化动态，所以放这里不行，排除 第三个空形容中华民族精神，同舟共济说的是共同面对困难，不能形容精神，排除",words:["与时俱进","博大精深","历久弥新","厚积薄发","同舟共济","波澜壮阔","源远流长"]},{id:"l1-3",source:"第一讲 · 2024 年深圳",material:"“从地名看文化，从文化看中国”，带着________的节目宗旨和不断精进的艺术手法，新一季《中国 地名大会》以地名知识为载体，从地理风貌、民间习俗、历史文化、文学作品、特色美食等多个维度全方 位全景式展现中华文化，________祖国大地的精彩纷呈，书写中国之进、阐释中国之变。 依次填入画横线部分最恰当的一项是：",options:["一脉相承 擘画","薪火相传 描摹","一脉相承 描摹","薪火相传 擘画"],answerIndex:2,analysis:"第一空，形容节目宗旨一直不变，一直没断，薪火相传侧重学问，文化技艺u，排除 BD 第二空说的是描绘，擘画说的是计划策划，擘画蓝图，擘画未来等，排除A",words:["一脉相承","描摹","擘画","薪火相传"]},{id:"l1-4",source:"第一讲 · 2023 年浙江事业单位",material:"年画样式匮乏在源头上卡住了聊城木版年画传承的脖子， 年画成品的严重雷同使得市场日渐________ 及传承人传承收益低微，这导致传承几乎________。非物质文化遗产保护活动虽为聊城木版年画传承创设 了一个良好的社会环境，但欲实现其良性传承还需多下功夫，如政府协助建立传承人队伍等。 依次填入画横线部分最恰当的一项是：",options:["低沉 青黄不接","消沉 难以为继","缩小 后继无人","低迷 半青半黄"],answerIndex:2,analysis:"第二个空直接确定答案，说的是以后传承没人了，后继无人，困难，空青黄不接通常说 的是断了一段，暂断，半青半黄指不成熟，难以为继指继续不下去，ABD 排除。",words:["后继无人","难以为继"]},{id:"l1-5",source:"第一讲 · 2023 年深圳市考",material:"（1）一边把那些态度不端、动机不纯的人淘汰出去，一边把那些具有正确认识、心怀理性期待的人 吸收进来，公务员队伍就能________、生生不息，公务员职业就能回归行使公权、服务公众的本位。 （2）一些腐败分子由于存在侥幸心理，仍然会铤而走险。 他们觉得只要做得滴水不漏，就不可能 ________，也就不可能查到自己的头上。 依次填入画横线部分最恰当的一项是：",options:["吐故纳新 原形毕露","除旧布新 东窗事发","除旧布新 原形毕露","吐故纳新 东窗事发"],answerIndex:3,analysis:"第一个空，说的就是公务员队伍，吐故纳新，排除 BC 第二个空，东窗事发是指犯罪等不好的事被发现，原形毕露指露出原型，排除A",words:["吐故纳新","除旧布新"]},{id:"l1-6",source:"第一讲 · 2025 年江苏省考",material:"自上古时期以来，华夏先民就通过粟和黍的栽培、陶器的烧制、冶铁的发明，________了农业文明的 辉煌篇章；汉唐之际，从造纸术到雕版印刷，这些发明创造为文化传承发展提供了重要________；宋元以 降， 《梦溪笔谈》 《授时历》 《天工开物》 《本草纲目》等科学典籍的问世，无一不是中华民族________、 与时俱进的优秀典范。 依次填入画横线部分最恰当的一项是：",options:["谱写 借鉴 除旧布新","铸就 载体 蜕故孳新","绘制 支撑 吐故纳新","开启 依托 革故鼎新"],answerIndex:3,analysis:"第一个空，全文谈的是历程，B 的铸就一般用来最后总结，排除，逻辑上刚开始，D 最合适，AC 也可以 第二个空，A 的借鉴是照着别人的学，排除。 第三个空，吐故纳新指的是人才的队伍这种变化，排除。中华民族革故鼎新形容文化民族特质， 与时俱进，选 D",words:["吐故纳新","支撑","载体","除旧布新","革故鼎新"]},{id:"l1-7",source:"第一讲 · 2018 年国考",material:"早在上世纪70 年代末， 钱学森就曾多次提出： 国防科技的发展不能________于 “追尾巴” “照镜子” ， 而是要________地开拓新领域和新方向。比如英国人针对重机枪机动性差的弱点，发明了坦克，一举撕裂 了枪炮林立的僵持局面。这类非对称式的发展思路有助于打破先进国家的技术垄断，形成后发优势。 依次填入画横线部分最恰当的一项是：",options:["拘泥 与众不同","满足 独辟蹊径","沉迷 标新立异","止步 别具匠心"],answerIndex:1,analysis:"第二个空后文说的是新领域， 新方向， 体现新，A 侧重和别人不一样，C 侧重也是和别人不一样， D 侧重构思想法设计不一样，排除 ACD，B 说的是开辟一个新的道路新的方向，当选",words:["标新立异"]},{id:"l1-8",source:"第一讲 · 2023 年新疆",material:"中国元素与现代奥运的激情碰撞、科技赋能下的________、 独具东方美学色彩的审美意象……2022 年 北京冬奥会、 冬残奥会虽然已落下帷幕，但 “两个奥运” 中形象鲜活的中国元素与创意无限的艺术________ 将永远镌刻在奥林匹克的历史中。 依次填入画横线部分最恰当的一项是：",options:["别出心裁 反响","匠心独运 呈现","推陈出新 构思","标新立异 表达"],answerIndex:1,analysis:"C 的推陈出新是去掉旧的，但是奥运是第一次，没有旧的，排除 C。D 的标新立异指新的主张或 者故意与他人不同， 排除D。 奥运是大事，A 的别出心裁指小的方面， 而且反响是别人给自己的反馈， 排除 A，B 当选",words:["别出心裁","匠心独运","推陈出新","标新立异"]},{id:"l1-9",source:"第一讲 · 2021 年甘肃省考",material:"我国有很庞大的老年群体，但他们却因为科技的发展，在生活中有很多地方 ________。不是他们 ________，不想接触新事物，而是一辈子的习惯，不是说改就能改的。 依次填入画横线部分最恰当的一项是：",options:["寸步难行 墨守成规","步履艰难 画地为牢","艰难跋涉 抱残守缺","举步维艰 固步自封"],answerIndex:3,analysis:"第二个空说的是他们主观上的不想接触新，D 固步自封就是指主观上， 可直接选D， 举步维艰是能走， 但是很难，寸步难行是走不了",words:["举步维艰","固步自封","墨守成规","寸步难行","抱残守缺","画地为牢"]},{id:"l1-10",source:"第一讲 · 2017 年联考",material:"中国绘画是以庄子哲学为精神宗旨的， 其最高境界是在人与对象的双重自然状态下实现物我浑融。 《庄 子·田子方》载，宋元君招试画师，应试者皆________，唯有一后到者，“解衣盘礴赢”，任性自然地投 身于画作 ,"量体裁衣"]},{id:"l3-50",source:"第三讲 · 2023 年国考",material:"红树林的地下部分长期处于厌氧环境，减缓了根系和凋落物的分解速率，加速了碳埋藏速率。此外， 红树林大多分布于沉积型海岸河口，由上游河流和海洋潮汐共同作用带来的大量外源性碳，被它们固定并 快速沉积下来。这“________”的组合拳使得红树林成为海岸带蓝碳碳汇的主要贡献者。 填入画横线部分最恰当的一项是：",options:["取长补短","标本兼治","开源节流","一举两得"],answerIndex:2,analysis:"",words:["开源节流","标本兼治"]},{id:"l3-51",source:"第三讲 · 2023 年联考",material:"所有消费都应该建立在自己已有的经济基础之上，应该________消费、有所节制。与其被“花钱一时 爽，还债三年光”的“伪精致”所累，真不如根据实际情况合理规划开支，务实购买必需品，________把 日子过好。 依次填入画横线部分最恰当的一项是：",options:["量入为出 细水长流","精打细算 细水长流","量入为出 勤俭持家","精打细算 勤俭持家"],answerIndex:0,analysis:"量入为出：根据收入的情况来安排支出对应题中建立在自己已有的经济基础之上 勤俭持家：形容人既勤劳又俭朴，与题意不符",words:["精打细算","细水长流","量入为出"]},{id:"l3-52",source:"第三讲 · 2021 年国考",material:"“人民城市人民建”。搭建民意“直通车”、公众“议事厅”，有事好商量，大家来出力，很多工作 就能做到________。比如上海能在短短一年内迅速形成垃圾分类的新风尚，靠的就是人民群众的主动性、 积极性与创造性。 填入画横线部分最恰当的一项是：",options:["立竿见影","事半功倍","万无一失","尽善尽美"],answerIndex:1,analysis:"根据题意，群众参与就会效果好、效率高，对应事半功倍 立竿见影：见效非常快，后面给的例子一年时间过长，不能选 万无一失强调安全 尽善尽美强调追求完美",words:["事半功倍","立竿见影"]},{id:"l3-53",source:"第三讲 · 2018 年国考",material:"医疗改革方案将引导医疗机构、医务人员，通过提供更多更好的诊疗服务，获得________的补偿。对 于过度治疗问题，该方案是一种________的做法，它让医生的收入与所开的药物、检查脱钩，让医疗工作 者的劳动收入真正体现在明处。 依次填入画横线部分最恰当的一项是：",options:["合法 立竿见影","公正 行之有效","适度 一劳永逸","合理 釜底抽薪"],answerIndex:3,analysis:"第一空：A 选项合法应该对应非法，B 选项公正强调公平正义（多用于法律有关语境） 第二空 釜底抽薪：从根本上解决问题 一劳永逸：常用作“没有什么事是一劳永逸的”不符合题意",words:["一劳永逸","立竿见影","行之有效","釜底抽薪"]},{id:"l3-54",source:"第三讲 · 2022 年江苏",material:"广大进城务工人员常常在医疗、社保、子女入学等涉及公共服务均等化的民生保障问题上面临 ________，这些都是摆在我们面前的现实问题。城镇化是一个渐进过程，很多问题的解决无法________， 但至少应该在发展的过程中，努力体现解决问题的诚意。 依次填入画横线部分最恰当的一项是：",options:["挫折 迎刃而解","窘境 一蹴而就","劣势 急功近利","困难 立竿见影"],answerIndex:1,analysis:"第一空：A 选项挫折强调整个事物发展过程不是一帆风顺的，中间会有小挫折、小坎坷 B 选项窘境形容困难的处境 C 选项劣势，题中没有比较不能选 第二空 一蹴而就：一下子就可以完成，无法一蹴而就对应前面“是一个渐进过程”，当选 立竿见影强调见效快，与题意不符",words:["一蹴而就","急功近利","立竿见影","迎刃而解"]},{id:"l3-55",source:"第三讲 · 2020 年事业单位联考",material:"进入“移动互联”时代，我们获取特定知识越来越容易。以往，需要在图书馆中找寻多日的研究资料， 今天，借助移动互联，借助一些搜索工具，这些知识都可以随时随地，________。今天，重要的已经不再 是掌握特定知识，而是具备较高的思维水平，而是对信息的重要性做出________，而是在各种可能的候选 方案中快速做出自己的抉择。 依次填入画横线部分最恰当的一项是： is:"",words:["一脉相承","不谋而合","并行不悖","相辅相成"]},{id:"l6-113",source:"第六讲 · 2019 年上海市考",material:"当年刘邦入咸阳，“缓刑弛禁，以慰其望”，采取的是“有所不为”。后刘备入蜀，诸葛亮则“威之 以法”“限之以爵”，采取的是“有所为”。“为”与“不为”________，都深得人心，实现大治，原因 就在于________：秦朝苛政，百姓苦不堪言，不为而治，顺应人民的意愿；而蜀中刘璋长期暗弱，豪强专 权自恣，必须严刑峻法。 依次填入画横线部分最恰当的一项是：",options:["异曲同工 度德量力","殊途同归 审时度势","背道而驰 实事求是","见仁见智 量力而行"],answerIndex:1,analysis:"",words:["审时度势","异曲同工","殊途同归","背道而驰","见仁见智","量力而行"]},{id:"l6-114",source:"第六讲 · 2023 年山东省考",material:"著名画家阎立本画的《历代帝王图》是中国历史上帝王形象的标准范本。让人________的是，阎立本 在画古代帝王像时， 并没有任何范本依据， 完全是凭借想象， 画出来的人物形象自然跟历史人物________。 当时的中国绘画理论中，“神似”的要求高于“形似”，因此在阎立本笔下的帝王外形________，只在表 情气质上有差异。比如，开国君主往往神情威严，亡国之君却面目憔悴。 依次填入画横线部分最恰当的一项是：",options:["不解 判若两人 伯仲之间","庆幸 天壤之别 丝毫不差","可惜 泾渭分明 如出一辙","遗憾 大相径庭 大同小异"],answerIndex:3,analysis:"",words:["大相径庭","天壤之别","如出一辙","泾渭分明"]},{id:"l6-115",source:"第六讲 · 2017 年 422 联考",material:"孔雀蜘蛛的体型非常小，只有4 毫米到5 毫米，其中，雌性蜘蛛比雄性蜘蛛大。不过，就是这样小的 身躯，也能靠着大自然的________吸引人们的注意。 填入画横线部分最恰当的一项是：",options:["鬼斧神工","精雕细刻","巧夺天工","匠心独运"],answerIndex:0,analysis:"",words:["匠心独运","巧夺天工","鬼斧神工"]},{id:"l6-116",source:"第六讲 · 2018 年贵州选调",material:"宋代真是大发宏愿的时代，绘画写实技巧________，无论花鸟还是山水，与自然物象________。恰恰 宋代又是我国古代科技发展的高峰，双峰并峙，正是“图像证史”一展身手的大舞台。 依次填入画横线部分最恰当的一项是：",options:["炉火纯青 不分轩轾","目无全牛 不分畛域","登堂入室 不谋而同","登峰造极 不爽毫厘"],answerIndex:3,analysis:"",words:["炉火纯青","登堂入室","登峰造极","目无全牛"]},{id:"l6-117",source:"第六讲 · 2024 年福建",material:"在________唐代诗人进入戏曲作品时， 赫赫有名的诗人如李白、 杜甫等有幸借助戏曲艺术被不断演绎、 重写，形成了________的唐代诗人题材戏曲作品。 依次填入画横线部分最恰当的一项是：",options:["援用 蔚然成风","援引 蔚为大观","采用 美轮美奂","引述 叹为观止"],answerIndex:1,analysis:"",words:["叹为观止","美轮美奂","蔚为大观","蔚然成风"]},{id:"l6-118",source:"第六讲 · 2021 年国考",material:"武侠精神是中华民族传统文化的宝贵财富， 也是伴随着 “功夫” 走向世界的________的中华文化符号。 无论 “兼济天下” 的入世情怀， “士不可不弘毅” 的责任担当， 还是 “诗酒年华、 仗剑天涯” 的洒脱性格， 都吸引着一代又一代的年轻人________。正因此， 充分折射这些精神的金庸小说才会________，引领了二 十世纪八九十年代万人空巷的武侠热，也引领了前些年武侠题材翻拍剧的创作热潮。 依次填入画横线部分最恰当的一项是：",options:["鲜明 心向往之 长盛不衰","典型 魂牵梦绕 方兴未艾","独特 前赴后继 家喻户晓","生动 孜孜以求 炙手可热"],answerIndex:0,analysis:"",words:["孜孜以求","家喻户晓","方兴未艾","炙手可热","长盛不衰"]},{id:"l4-59",source:"第四讲 · 2023 年湖北事业单位",material:"踏上向第二个百年奋斗目标进军的新征程，只要我们继续守好人民的心，就一定能派发起亿万人民 ________、勇毅前行的强大力量，谱写新时代中国特色社会主义更加绚丽的华章。 填入画横线部分最恰当的一项是：",options:["踔厉奋发","勤力同心","同舟共济","团结奋进"],answerIndex:0,analysis:"",words:["同舟共济","踔厉奋发"]},{id:"l4-60",source:"第四讲 · 2018 年浙江选调",material:"有人说，“安逸的日子，有时是一种腐蚀剂”。这话不无道理。远离了战火硝烟，有些人就会逐渐淡 忘为国捐躯的________；过惯了衣食无忧的生活，有些人就会________、精神空虚。少数人曲解历史、恶 搞先烈的行为，应引起全社会的警觉。 依次填入画横线部分最恰当的一项是：",options:["刚正不阿 趾高气扬","大义凛然 忘乎所以","永垂不朽 得意洋洋","视死如归 不思进取"],answerIndex:1,analysis:"批注 [1]: “让我们的人民振奋”的意思；ABD 均可以，但 这个属于热词，常见的搭配 批注 [2]: 共同面对困难，不符合语境 批注 [3]: 此处出现提示，说少数人的这些行为有些过了， 开始恶搞先烈，曲解历史，所以不能是不思进取 批注 [4]: 形容人非常正直，不阿谀奉承，但不是为国捐躯 时候的一种状态，不符合语境 批注 [5]: 这个词可以放于第一空 批注 [6]: 一般用于形容“革命先烈永垂不朽”，不符合语 境 批注 [7]: 也可以放于第一空 批注 [8]: 看空格前，确实有道理，但是空格后面给出了一 个说明，从整体考虑，应该选择“忘乎所以”",words:["大义凛然","视死如归"]},{id:"l4-61",source:"第四讲 · 2019 年贵州选调",material:"年轻干部要想行得端、走得正，就必须涵养道德操守，明礼诚信，特别是要敢于讲真话、讲实话，切 忌开“空头支票”，________说好话、________说套话、________说大话、规避责任说假话。 依次填入画横线部分最恰当的一项是：",options:["曲意逢迎 心口不一 不切实际","委曲求全 虚与委蛇 好高骛远","阿谀奉承 独善其身 好大喜功","投其所好 明哲保身 沽名钓誉"],answerIndex:3,analysis:"",words:["好大喜功","好高骛远","委曲求全","投其所好","明哲保身","曲意逢迎","沽名钓誉","独善其身","虚与委蛇","阿谀奉承"]},{id:"l4-62",source:"第四讲 · 2015 年国考",material:"发展经济并没有错，有效利用文化资源带动当地社会发展也是很好的尝试。但倘若不论真伪，抑或不 顾文化自身的形态，________、 强行落地，旅游未必能够发展起来， 反而可能________。 它所反映出来的， 恰恰是对文化缺乏认识、对建设缺乏创新的“啃古”心态。 依次填入画横线部分最恰当的一项是：",options:["牵强附会 劳民伤财","曲意逢迎 适得其反","偷梁换柱 进退维谷","附庸风雅 无所适从"],answerIndex:0,analysis:"",words:["偷梁换柱","劳民伤财","无所适从","曲意逢迎","进退维谷","适得其反","附庸风雅"]},{id:"l4-63",source:"第四讲 · 2019 年天津事业单位",material:"①________是指为了装点个人的门面而结交社会文化名士，并积极主动地从事有关文化的活动。此词 语不能误用作褒义。 ②________是指某种事物或行为结果比人预想的要好一些，基本上还算能够让人满意。 批注 [9]: 为了规避责任而说假话，前面类比，都是为了什 么而做什么 批注 [10]: 不是为了“心口不一”去说套话，不符合语境 批注 [11]: 可能是年轻干部可能犯的错误 批注 [12]: 词义不对，不是委屈自己求得保全，不符合题 意 批注 [13]: 均是目的表述，为了“投其所好”说好话等， 符合语境 批注 [14]: 均是年轻干部可能犯的错误，不分析，光看词 义也可以大致锁定答案 批注 [15]: 不是去迎合谁，不符合语境 批注 [16]: 用一个东西代替另一个东西，“梁”和“柱” 是核心，和“移花接木”是近义词，置于此处不符合语境 批注 [17]: 一般说人，不符合语境 ③________指针对同一个问题，各个人因为观察、分析、认识的角度不同而导致见解也不相同。 依次填入画横线部分最恰当的一项是：",options:[
